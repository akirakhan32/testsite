<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-hidden="true">
  <rect width="720" height="900" fill="#0E1014"/>
  <!-- ground frame -->
  <rect x="88" y="620" width="544" height="8" fill="none" stroke="#3A4050" stroke-width="1.5" opacity="0.5"/>
  <!-- conduits -->
  <line x1="210" y1="470" x2="340" y2="360" stroke="#3A4050" stroke-width="6" stroke-linecap="round"/>
  <line x1="400" y1="340" x2="530" y2="430" stroke="#3A4050" stroke-width="5" stroke-linecap="round"/>
  <line x1="240" y1="520" x2="360" y2="480" stroke="#3A4050" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="280" y1="300" x2="340" y2="250" stroke="#3A4050" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <!-- intake node -->
  <g transform="translate(140 420)">
    <rect width="140" height="90" rx="4" fill="#1E2430"/>
    <rect x="20" y="12" width="80" height="8" fill="#F4F1EA" opacity="0.9"/>
  </g>
  <!-- route node (active) -->
  <g transform="translate(310 280)">
    <rect width="130" height="110" rx="4" fill="#161A22"/>
    <rect x="8" y="-6" width="114" height="8" fill="#C96A3D"/>
  </g>
  <!-- exception node -->
  <g transform="translate(480 400)">
    <rect width="120" height="80" rx="4" fill="#1E2430"/>
    <rect x="18" y="14" width="70" height="8" fill="#F4F1EA" opacity="0.85"/>
  </g>
  <!-- satellite -->
  <rect x="250" y="200" width="42" height="42" rx="3" fill="#161A22"/>
  <!-- labels -->
  <text x="160" y="560" fill="#F4F1EA" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1.5" opacity="0.7">INTAKE</text>
  <text x="340" y="260" fill="#C96A3D" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1.5">ROUTE</text>
  <text x="500" y="530" fill="#F4F1EA" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1.5" opacity="0.7">EXCEPTION</text>
  <!-- craft mark -->
  <rect x="712" y="0" width="8" height="8" fill="#C96A3D"/>
</svg>
